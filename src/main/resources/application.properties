spring.application.name=GINS

server.port=10000
#spring. jpa.defer-datasource-initialization=true
#spring. jpa.show-sq1=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class.name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms


# \connect username@port

server.address=0.0.0.0

#spring. security.user.name=tapu
#spring. security. user.password=1234

springdoc.swagger-ui.path=/docs

# Brevo (Sendinblue) REST API Configuration (Uses HTTPS port 443, avoiding blocked SMTP ports on Render)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:inventory@stockpulse.com}
brevo.sender.name=${BREVO_SENDER_NAME:Stock Pulse} 