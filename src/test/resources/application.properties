# Use in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Don't try to validate schema against MySQL syntax
spring.jpa.hibernate.ddl-auto=create-drop

RSA_PUBLIC_KEY=classpath:certs/public.pem
RSA_PRIVATE_KEY=classpath:certs/private.pem

# Brevo configuration for Tests
brevo.api.key=dummy-test-key
brevo.sender.email=test@example.com
brevo.sender.name=Test Stock Pulse
